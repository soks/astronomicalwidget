name: Update seeing and deploy widget

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/fetch_seeing.py'
      - '.github/workflows/deploy-widget.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'  # Every 3 hours, UTC. GitHub may run it late.

permissions:
  contents: read

concurrency:
  group: astronomical-widget-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Fetch 7Timer! seeing
        run: python3 scripts/fetch_seeing.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
